<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部活動 欠席・遅刻連絡ポータル - 管理者画面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <!-- ログイン画面 -->
  <div id="loginScreen" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
    <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
      <i class="fa-solid fa-lock mr-2 text-amber-500"></i> 管理者ログイン
    </h2>
    <input type="password" id="passInput" placeholder="パスワードを入力"
      class="w-full px-3 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button id="loginBtn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg">
      ログイン
    </button>
  </div>

  <!-- 管理画面コンテンツ -->
  <div id="adminContent" class="max-w-4xl mx-auto hidden space-y-4">
    
    <!-- ヘッダーと日付フィルター -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 rounded-xl shadow gap-4">
      <h1 class="text-xl font-bold text-slate-800 flex items-center">
        <i class="fa-solid fa-volleyball mr-2 text-amber-500"></i> 連絡一覧
      </h1>
      <div class="flex items-center space-x-2">
        <span class="text-sm font-bold text-slate-600">日付:</span>
        <input type="date" id="filterDate" class="border px-2 py-1 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="clearFilter" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1.5 rounded font-bold">全表示</button>
      </div>
    </div>

    <!-- リスト一覧 -->
    <div id="listContainer" class="space-y-3">
      <!-- リアルタイムでここに届きます -->
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "club-app-f9a2f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "1234"; // パスワード設定

    const loginScreen = document.getElementById("loginScreen");
    const adminContent = document.getElementById("adminContent");
    const passInput = document.getElementById("passInput");
    const loginBtn = document.getElementById("loginBtn");
    const listContainer = document.getElementById("listContainer");
    const filterDate = document.getElementById("filterDate");
    const clearFilter = document.getElementById("clearFilter");

    let rawData = [];

    loginBtn.addEventListener("click", () => {
      if (passInput.value === ADMIN_PASSWORD) {
        loginScreen.classList.add("hidden");
        adminContent.classList.remove("hidden");
        startRealtimeSync();
      } else {
        alert("パスワードが違います");
      }
    });

    // 爆速リアルタイム同期
    function startRealtimeSync() {
      const q = query(collection(db, "absences"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        rawData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderUI();
      });
    }

    function renderUI() {
      listContainer.innerHTML = "";
      const filterVal = filterDate.value;

      const itemsToDisplay = filterVal 
        ? rawData.filter(item => item.targetDate === filterVal)
        : rawData;

      if (itemsToDisplay.length === 0) {
        listContainer.innerHTML = `<div class="p-6 text-center text-slate-400 bg-white rounded-xl shadow">該当する連絡はありません</div>`;
        return;
      }

      itemsToDisplay.forEach(item => {
        const isChecked = item.status === "確認済み";
        const card = document.createElement("div");
        card.className = `p-4 rounded-xl shadow border-l-4 ${isChecked ? 'bg-slate-50 border-slate-400 opacity-75' : 'bg-white border-blue-500'} flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition`;

        card.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800">${item.targetDate || '本日'}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded ${item.type === '欠席' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">${item.type}</span>
              <span class="font-bold text-slate-800 text-lg">${item.name}</span>
            </div>
            <p class="text-slate-600 text-sm">${item.reason}</p>
          </div>
          <div class="flex items-center space-x-2 self-end sm:self-center">
            <button onclick="toggleStatus('${item.id}', '${item.status}')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-white ${isChecked ? 'bg-slate-500 hover:bg-slate-600' : 'bg-green-600 hover:bg-green-700'}">
              ${isChecked ? '未確認に戻す' : '確認完了'}
            </button>
            <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-red-600">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    filterDate.addEventListener("change", renderUI);
    clearFilter.addEventListener("click", () => {
      filterDate.value = "";
      renderUI();
    });

    window.toggleStatus = async (id, currentStatus) => {
      const newStatus = currentStatus === "確認済み" ? "未確認" : "確認済み";
      await updateDoc(doc(db, "absences", id), { status: newStatus });
    };

    window.deleteItem = async (id) => {
      if (confirm("本当に削除しますか？")) {
        await deleteDoc(doc(db, "absences", id));
      }
    };
  </script>
</body>
</html>
