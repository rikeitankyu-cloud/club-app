<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部活動 欠席・遅刻連絡ポータル - 管理者画面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center">
          <i class="fa-solid fa-volleyball mr-2 text-amber-300"></i> 部活動 欠席連絡システム
        </h1>
        <p class="text-xs text-indigo-200 mt-0.5">連絡・確認連絡ポータル（管理者用）</p>
      </div>
      <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500/30 transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> ログアウト
      </button>
    </div>
  </header>

  <!-- 1. パスワード認証画面 -->
  <main id="auth-section" class="max-w-md mx-auto mt-12 p-6 bg-white rounded-2xl shadow-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-slate-800">管理者ログイン</h2>
      <p class="text-xs text-slate-500 mt-1">状況確認ページを開くにはパスワードが必要です</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="mb-4">
        <input type="password" id="admin-pass" placeholder="パスワードを入力 (初期: 1234)" required
          class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
        <p id="error-msg" class="text-red-500 text-xs mt-2 hidden text-center">
          <i class="fa-solid fa-circle-exclamation mr-1"></i>パスワードが違います
        </p>
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition shadow-sm">
        解除して確認する
      </button>
    </form>
  </main>

  <!-- 2. 状況確認メイン画面 -->
  <main id="admin-content" class="max-w-4xl mx-auto mt-6 px-4 hidden">
    
    <!-- ステータスバー & カレンダー表示エリア -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-2 text-xs text-emerald-700 bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-200">
        <i class="fa-solid fa-bolt text-emerald-500"></i>
        <span class="font-bold">リアルタイム同期中</span>
      </div>

      <!-- カレンダー表示・日付選択コントロール -->
      <div class="flex items-center gap-2">
        <button onclick="openCalendarPicker()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl font-bold transition flex items-center shadow-sm">
          <i class="fa-regular fa-calendar-days mr-1.5"></i> カレンダーを表示
        </button>
        <!-- 実際の内部日付選択（普段はスッキリ収納、またはカレンダーボタンから連動） -->
        <input type="date" id="filterDate" onchange="renderFilteredList()"
          class="px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
        <button onclick="setTodayFilter()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-2 rounded-xl font-bold transition">
          今日
        </button>
      </div>
    </div>

    <!-- ダッシュボードカード集計 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
        <div>
          <p class="text-xs text-slate-500 font-bold mb-1">選択日の欠席</p>
          <p class="text-2xl font-black text-rose-600" id="statAbsent">0<span class="text-sm font-normal text-slate-600 ml-1">人</span></p>
        </div>
        <div class="w-10 h-10 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center text-lg">
          <i class="fa-solid fa-user-xmark"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
        <div>
          <p class="text-xs text-slate-500 font-bold mb-1">選択日の遅刻/早退</p>
          <p class="text-2xl font-black text-amber-500" id="statLate">0<span class="text-sm font-normal text-slate-600 ml-1">人</span></p>
        </div>
        <div class="w-10 h-10 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-lg">
          <i class="fa-solid fa-clock"></i>
        </div>
      </div>

      <!-- 未確認カードクリックで未確認一覧に切り替え -->
      <div onclick="filterUnread()" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center cursor-pointer hover:bg-indigo-50/40 hover:border-indigo-300 transition group">
        <div>
          <p class="text-xs text-slate-500 group-hover:text-indigo-600 font-bold mb-1 flex items-center">
            未確認の連絡（全体） <i class="fa-solid fa-arrow-pointer ml-1 text-[10px] opacity-60"></i>
          </p>
          <p class="text-2xl font-black text-indigo-600" id="statUnread">0<span class="text-sm font-normal text-slate-600 ml-1">件</span></p>
        </div>
        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-lg group-hover:bg-indigo-600 group-hover:text-white transition">
          <i class="fa-solid fa-envelope"></i>
        </div>
      </div>
    </div>

    <!-- 一覧メインエリア -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
        <h2 class="text-sm font-bold text-slate-700 flex items-center" id="listTitle">
          <i class="fa-solid fa-list mr-2 text-indigo-600"></i> 届いている連絡一覧
        </h2>
        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold" id="totalCount">0件</span>
      </div>

      <!-- リアルタイムデータリスト -->
      <div id="data-list" class="space-y-3">
        <p class="text-center text-slate-400 text-xs py-8"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 読み込み中...</p>
      </div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAar1cL7AwErIJCBalCTIxndvYu7IW3VVc",
      authDomain: "club-app-6b501.firebaseapp.com",
      projectId: "club-app-6b501",
      storageBucket: "club-app-6b501.firebasestorage.app",
      messagingSenderId: "575608909702",
      appId: "1:575608909702:web:57394e365b76ba27970607",
      measurementId: "G-9MWZKWSQTX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "1234";
    let allFetchedData = []; 
    let isUnreadMode = false;

    window.handleLogin = function(event) {
      event.preventDefault();
      const inputPass = document.getElementById("admin-pass").value;
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");
        
        document.getElementById("filterDate").valueAsDate = new Date();
        startRealtimeListener();
      } else {
        document.getElementById("error-msg").classList.remove("hidden");
      }
    };

    window.logout = function() {
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("admin-content").classList.add("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
      document.getElementById("admin-pass").value = "";
      isUnreadMode = false;
    };

    // 「カレンダーを表示」ボタンを押したときにカレンダーピッカーを開く
    window.openCalendarPicker = function() {
      const dateInput = document.getElementById("filterDate");
      if (dateInput.showPicker) {
        dateInput.showPicker(); // モダンブラウザでカレンダーポップアップを直接開く
      } else {
        dateInput.focus();
      }
    };

    window.setTodayFilter = function() {
      isUnreadMode = false;
      document.getElementById("filterDate").valueAsDate = new Date();
      renderFilteredList();
    };

    window.filterUnread = function() {
      isUnreadMode = true;
      renderFilteredList();
    };

    function startRealtimeListener() {
      const q = query(collection(db, "absences"), limit(100));
      
      onSnapshot(q, (snapshot) => {
        allFetchedData = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          data.id = docSnap.id;
          allFetchedData.push(data);
        });

        allFetchedData.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        renderFilteredList();
      });
    }

    window.renderFilteredList = function() {
      isUnreadMode = false; // 日付を変更したら通常モードに戻す
      const selectedDate = document.getElementById("filterDate").value;
      const listContainer = document.getElementById("data-list");
      const listTitle = document.getElementById("listTitle");

      const filteredData = selectedDate 
        ? allFetchedData.filter(d => d.targetDate === selectedDate)
        : allFetchedData;

      listTitle.innerHTML = `<i class="fa-solid fa-list mr-2 text-indigo-600"></i> 届いている連絡一覧（${selectedDate || '指定なし'}）`;

      const unreadCount = allFetchedData.filter(d => d.status === "未確認").length;
      document.getElementById("statUnread").innerText = unreadCount;

      if (filteredData.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <i class="fa-solid fa-inbox text-3xl mb-2"></i>
            <p class="text-xs">選択された日付（${selectedDate}）に届いている連絡はありません。</p>
          </div>`;
        updateStatsForFiltered(filteredData);
        return;
      }

      let htmlBuffer = "";
      filteredData.forEach((data) => {
        const isChecked = data.status === "確認済み";
        const typeBadge = data.type === "欠席" 
          ? `<span class="bg-rose-100 text-rose-700 font-bold text-xs px-2 py-0.5 rounded">欠席</span>`
          : `<span class="bg-amber-100 text-amber-800 font-bold text-xs px-2 py-0.5 rounded">${data.type}</span>`;
        
        const statusBadge = isChecked
          ? `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded font-bold">確認済み</span>`
          : `<span class="bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded font-bold">未確認</span>`;

        const toggleBtn = isChecked
          ? `<button onclick="toggleStatus('${data.id}', '未確認')" class="text-xs border border-slate-300 text-slate-600 px-2.5 py-1 rounded-lg hover:bg-slate-100 flex items-center">
               <i class="fa-solid fa-rotate-left mr-1"></i> 未確認に戻す
             </button>`
          : `<button onclick="toggleStatus('${data.id}', '確認済み')" class="text-xs bg-indigo-600 text-white font-bold px-3 py-1 rounded-lg hover:bg-indigo-700 flex items-center shadow-sm">
               <i class="fa-solid fa-check mr-1"></i> 確認済みにする
             </button>`;

        htmlBuffer += `
          <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/50">
            <div class="flex flex-wrap justify-between items-start gap-2 mb-2">
              <div class="flex items-center gap-2">
                ${typeBadge}
                <span class="font-bold text-slate-800 text-sm">${data.name} <span class="text-xs text-slate-500 font-normal">(${data.grade})</span></span>
                ${statusBadge}
              </div>
              <div class="flex items-center gap-2">
                ${toggleBtn}
                <button onclick="deleteItem('${data.id}')" class="text-slate-400 hover:text-rose-600 text-xs p-1">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
            <p class="text-xs text-slate-500 mb-1">
              <i class="fa-regular fa-calendar mr-1"></i>対象日: ${data.targetDate} &nbsp; 
              <i class="fa-solid fa-circle-info mr-1"></i>${data.category}
            </p>
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-600">
              ${data.detail || '（詳細理由の記入なし）'}
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = htmlBuffer;
      updateStatsForFiltered(filteredData);
    };

    window.toggleStatus = async function(id, newStatus) {
      await updateDoc(doc(db, "absences", id), { status: newStatus });
    };

    window.deleteItem = async function(id) {
      if (confirm("この連絡を削除してもよろしいですか？")) {
        await deleteDoc(doc(db, "absences", id));
      }
    };

    function updateStatsForFiltered(filteredList) {
      const absentCount = filteredList.filter(d => d.type === "欠席").length;
      const lateCount = filteredList.filter(d => d.type === "遅刻" || d.type === "早退").length;

      document.getElementById("statAbsent").innerText = absentCount;
      document.getElementById("statLate").innerText = lateCount;
      document.getElementById("totalCount").innerText = `${filteredList.length}件`;
    }
  </script>
</body>
</html>
