<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欠席連絡システム - 管理者画面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome (アイコン) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center">
        <i class="fa-solid fa-user-shield me-2 text-amber-300"></i> 部活欠席連絡 - 管理者画面
      </h1>
      <a href="index.html" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-2 rounded text-white transition flex items-center">
        <i class="fa-solid fa-paper-plane me-1"></i> 申請フォームへ
      </a>
    </div>
  </header>

  <!-- 1. パスワード認証画面 -->
  <main id="auth-section" class="max-w-md mx-auto mt-12 p-6 bg-white rounded-2xl shadow-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-slate-800">管理者ログイン</h2>
      <p class="text-xs text-slate-500 mt-1">状況確認ページを開くにはパスワードが必要です</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="mb-4">
        <input type="password" id="admin-pass" placeholder="パスワードを入力 (初期: 1234)" required
          class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
        <p id="error-msg" class="text-red-500 text-xs mt-2 hidden text-center">
          <i class="fa-solid fa-circle-exclamation me-1"></i>パスワードが違います
        </p>
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">
        解除して確認する
      </button>
    </form>
  </main>

  <!-- 2. 状況確認メイン画面 (認証前は非表示) -->
  <main id="admin-content" class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-2xl shadow-md border border-slate-200 hidden">
    <div class="flex justify-between items-center mb-6 pb-3 border-b">
      <div>
        <h2 class="text-lg font-bold text-slate-800">届いている連絡一覧</h2>
        <p class="text-xs text-slate-500">部員から提出された欠席・遅刻連絡のデータです。</p>
      </div>
      <button onclick="logout()" class="text-xs text-slate-500 hover:text-red-600 transition flex items-center">
        <i class="fa-solid fa-right-from-bracket me-1"></i> ログアウト
      </button>
    </div>

    <!-- データ表示エリア -->
    <div id="data-list" class="space-y-3">
      <!-- ※Firebase連携後にここにカード形式で一覧が表示されます -->
      <div class="bg-slate-50 p-8 rounded-xl border border-dashed border-slate-300 text-center text-slate-500">
        <i class="fa-solid fa-inbox text-3xl mb-2 text-slate-400"></i>
        <p class="text-sm">データはまだありません。</p>
        <p class="text-xs text-slate-400 mt-1">※ Firebaseデータベースと連携すると、リアルタイムでここに部員の連絡が表示されます。</p>
      </div>
    </div>
  </main>

  <script>
    // 管理者パスワード (好きな暗号や数字に変更できます)
    const ADMIN_PASSWORD = "1234";

    function handleLogin(event) {
      event.preventDefault();
      const inputPass = document.getElementById("admin-pass").value;
      const errorMsg = document.getElementById("error-msg");

      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        errorMsg.classList.add("hidden");
      } else {
        errorMsg.classList.remove("hidden");
      }
    }

    function logout() {
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("admin-content").classList.add("hidden");
      document.getElementById("admin-pass").value = "";
    }
  </script>
</body>
</html>
