<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部活動 欠席・遅刻連絡ポータル - 管理者画面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center">
          <i class="fa-solid fa-volleyball mr-2 text-amber-300"></i> 部活動 欠席連絡システム
        </h1>
        <p class="text-xs text-indigo-200 mt-0.5">連絡・確認連絡ポータル（管理者用）</p>
      </div>
      <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500/30 transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> ログアウト
      </button>
    </div>
  </header>

  <!-- 1. パスワード認証画面 -->
  <main id="auth-section" class="max-w-md mx-auto mt-12 p-6 bg-white rounded-2xl shadow-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-slate-800">管理者ログイン</h2>
      <p class="text-xs text-slate-500 mt-1">状況確認ページを開くにはパスワードが必要です</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="mb-4">
        <input type="password" id="admin-pass" placeholder="パスワードを入力 (初期: 1234)" required
          class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
        <p id="error-msg" class="text-red-500 text-xs mt-2 hidden text-center">
          <i class="fa-solid fa-circle-exclamation mr-1"></i>パスワードが違います
        </p>
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition shadow-sm">
        解除して確認する
      </button>
    </form>
  </main>

  <!-- 2. 状況確認メイン画面 -->
  <main id="admin-content" class="max-w-4xl mx-auto mt-6 px-4 hidden space-y-6">
    
    <!-- LINE風 インラインカレンダーウィジェット -->
    <div class="bg-indigo-950 text-white p-5 rounded-2xl shadow-md border border-indigo-900">
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
          <h2 id="calendarMonthTitle" class="text-lg font-bold tracking-wide">2026年 9月</h2>
          <div class="flex items-center gap-1.5">
            <div class="flex items-center bg-indigo-900/85 rounded-lg p-0.5 border border-indigo-700/50">
              <button onclick="changeMonth(-1)" class="px-2.5 py-1 text-xs hover:bg-indigo-700 rounded-md transition"><i class="fa-solid fa-chevron-left"></i></button>
              <button onclick="changeMonth(1)" class="px-2.5 py-1 text-xs hover:bg-indigo-700 rounded-md transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <!-- 「今日」ボタンをおしゃれに修正 -->
            <button onclick="goToToday()" class="px-2.5 py-1 text-xs bg-indigo-900/85 hover:bg-indigo-700 text-indigo-200 hover:text-white rounded-lg border border-indigo-700/50 transition font-medium flex items-center gap-1">
              <i class="fa-solid fa-calendar-day text-indigo-400"></i> 本日
            </button>
          </div>
        </div>
      </div>

      <!-- 曜日ヘッダー -->
      <div class="grid grid-cols-7 text-center text-xs font-bold text-indigo-300 mb-2">
        <span class="text-rose-400">日</span>
        <span>月</span>
        <span>火</span>
        <span>水</span>
        <span>木</span>
        <span>金</span>
        <span class="text-sky-400">土</span>
      </div>

      <!-- 日付グリッド -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
    </div>

    <!-- ダッシュボードカード集計 -->
    <div class="grid grid-cols-3 gap-2 md:gap-4">
      <!-- 欠席カード -->
      <div onclick="setFilterMode('absent')" id="cardAbsent" class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border-2 border-indigo-600 flex flex-col md:flex-row justify-between items-center cursor-pointer transition group text-center md:text-left">
        <div class="w-full">
          <p class="text-[10px] md:text-xs text-slate-500 font-bold mb-1 truncate">欠席</p>
          <p class="text-xl md:text-2xl font-black text-rose-600" id="statAbsent">0<span class="text-xs md:text-sm font-normal text-slate-600 ml-0.5">人</span></p>
        </div>
      </div>

      <!-- 選択日の遅刻/早退カード -->
      <div onclick="setFilterMode('late')" id="cardLate" class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center cursor-pointer hover:border-indigo-300 transition group text-center md:text-left">
        <div class="w-full">
          <p class="text-[10px] md:text-xs text-slate-500 font-bold mb-1 truncate">遅刻/早退</p>
          <p class="text-xl md:text-2xl font-black text-amber-500" id="statLate">0<span class="text-xs md:text-sm font-normal text-slate-600 ml-0.5">人</span></p>
        </div>
      </div>

      <!-- 未確認の連絡カード -->
      <div onclick="setFilterMode('unread')" id="cardUnread" class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center cursor-pointer hover:border-indigo-300 transition group text-center md:text-left">
        <div class="w-full">
          <p class="text-[10px] md:text-xs text-slate-500 font-bold mb-1 truncate">未確認</p>
          <p class="text-xl md:text-2xl font-black text-indigo-600" id="statUnread">0<span class="text-xs md:text-sm font-normal text-slate-600 ml-0.5">件</span></p>
        </div>
      </div>
    </div>

    <!-- 選択された項目のリスト表示エリア -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
        <h2 class="text-sm font-bold text-slate-700 flex items-center" id="listTitle">
          <i class="fa-solid fa-list mr-2 text-indigo-600"></i> 選択日の欠席一覧
        </h2>
        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold" id="totalCount">0件</span>
      </div>

      <!-- リアルタイムデータリスト -->
      <div id="data-list" class="space-y-3">
        <p class="text-center text-slate-400 text-xs py-8"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 読み込み中...</p>
      </div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAar1cL7AwErIJCBalCTIxndvYu7IW3VVc",
      authDomain: "club-app-6b501.firebaseapp.com",
      projectId: "club-app-6b501",
      storageBucket: "club-app-6b501.firebasestorage.app",
      messagingSenderId: "575608909702",
      appId: "1:575608909702:web:57394e365b76ba27970607",
      measurementId: "G-9MWZKWSQTX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "Yasume888";
    let allFetchedData = []; 
    let uniqueLatestData = []; 
    let currentFilterMode = "absent";
    let currentCalendarDate = new Date();
    let selectedDateStr = formatDateKey(new Date());

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    window.handleLogin = function(event) {
      event.preventDefault();
      const inputPass = document.getElementById("admin-pass").value;
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");
        
        selectedDateStr = formatDateKey(new Date());
        currentCalendarDate = new Date();
        currentFilterMode = "absent";
        updateCardStyles();
        startRealtimeListener();
      } else {
        document.getElementById("error-msg").classList.remove("hidden");
      }
    };

    window.logout = function() {
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("admin-content").classList.add("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
      document.getElementById("admin-pass").value = "";
    };

    window.changeMonth = function(direction) {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
      renderCalendar();
    };

    window.goToToday = function() {
      currentCalendarDate = new Date();
      selectedDateStr = formatDateKey(new Date());
      renderCalendar();
      renderFilteredList();
    };

    window.selectDate = function(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
      renderFilteredList();
    };

    window.setFilterMode = function(mode) {
      currentFilterMode = mode;
      updateCardStyles();
      renderFilteredList();
    };

    function updateCardStyles() {
      const cardAbsent = document.getElementById("cardAbsent");
      const cardLate = document.getElementById("cardLate");
      const cardUnread = document.getElementById("cardUnread");

      const baseClass = "bg-white p-3 md:p-4 rounded-2xl shadow-sm border flex flex-col md:flex-row justify-between items-center cursor-pointer transition group text-center md:text-left ";

      cardAbsent.className = baseClass + (currentFilterMode === "absent" ? "border-2 border-indigo-600" : "border-slate-200 hover:border-indigo-300");
      cardLate.className = baseClass + (currentFilterMode === "late" ? "border-2 border-indigo-600" : "border-slate-200 hover:border-indigo-300");
      cardUnread.className = baseClass + (currentFilterMode === "unread" ? "border-2 border-indigo-600" : "border-slate-200 hover:border-indigo-300");
    }

    function startRealtimeListener() {
      const q = query(collection(db, "absences"), limit(200));
      
      onSnapshot(q, (snapshot) => {
        allFetchedData = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          data.id = docSnap.id;
          allFetchedData.push(data);
        });

        allFetchedData.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

        const latestMap = new Map();
        allFetchedData.forEach(item => {
          const key = `${item.targetDate}_${item.name}`;
          if (!latestMap.has(key)) {
            latestMap.set(key, item);
          }
        });
        uniqueLatestData = Array.from(latestMap.values());

        renderCalendar();
        renderFilteredList();
      });
    }

    function renderCalendar() {
      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      
      document.getElementById("calendarMonthTitle").innerText = `${year}年 ${month + 1}月`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const prevLastDay = new Date(year, month, 0).getDate();

      const gridContainer = document.getElementById("calendarGrid");
      let html = "";
      
      const unreadDates = new Set(uniqueLatestData.filter(d => d.status === "未確認").map(d => d.targetDate));
      
      const dateTypesMap = {};
      uniqueLatestData.forEach(d => {
        if (!dateTypesMap[d.targetDate]) {
          dateTypesMap[d.targetDate] = { hasAbsent: false, hasLateOrEarly: false };
        }
        if (d.type === "欠席") {
          dateTypesMap[d.targetDate].hasAbsent = true;
        } else if (d.type === "遅刻" || d.type === "早退") {
          dateTypesMap[d.targetDate].hasLateOrEarly = true;
        }
      });

      for (let i = firstDayIndex; i > 0; i--) {
        const dNum = prevLastDay - i + 1;
        html += `<div class="py-2 text-indigo-500/40 text-xs">${dNum}</div>`;
      }

      for (let i = 1; i <= lastDay; i++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(i).padStart(2, '0');
        const thisDateStr = `${year}-${mStr}-${dStr}`;

        const isSelected = (thisDateStr === selectedDateStr);
        const isToday = (thisDateStr === formatDateKey(new Date()));
        const hasUnread = unreadDates.has(thisDateStr);
        const dayInfo = dateTypesMap[thisDateStr];

        let btnClass = "py-1.5 rounded-xl transition flex flex-col items-center justify-center relative ";
        if (isSelected) {
          btnClass += "bg-indigo-600 text-white font-bold shadow-md scale-105 z-10";
        } else if (hasUnread) {
          btnClass += "bg-[#e6e6fa] text-slate-900 font-bold shadow-sm"; // 未確認がある日の背景色変更
        } else if (isToday) {
          btnClass += "bg-indigo-800/80 text-white font-bold border border-indigo-400/40";
        } else {
          btnClass += "hover:bg-indigo-900 text-indigo-100";
        }

        // ドットの出し分け（欠席＝赤、遅刻早退＝黄）
        let indicator = `<span class="w-1.5 h-1.5 opacity-0 mt-0.5"></span>`;
        if (dayInfo) {
          if (dayInfo.hasAbsent) {
            indicator = `<span class="w-1.5 h-1.5 bg-rose-500 rounded-full mt-0.5"></span>`;
          } else if (dayInfo.hasLateOrEarly) {
            indicator = `<span class="w-1.5 h-1.5 bg-amber-400 rounded-full mt-0.5"></span>`;
          }
        }

        html += `
          <button onclick="selectDate('${thisDateStr}')" class="${btnClass}">
            <span class="text-xs leading-none">${i}</span>
            ${indicator}
          </button>
        `;
      }

      gridContainer.innerHTML = html;
    }

    window.renderFilteredList = function() {
      const listContainer = document.getElementById("data-list");
      const listTitle = document.getElementById("listTitle");

      let filteredData = [];

      if (currentFilterMode === "absent") {
        filteredData = uniqueLatestData.filter(d => d.targetDate === selectedDateStr && d.type === "欠席");
        listTitle.innerHTML = `<i class="fa-solid fa-list mr-2 text-indigo-600"></i> 選択日の欠席一覧（${selectedDateStr}）`;
      } else if (currentFilterMode === "late") {
        filteredData = uniqueLatestData.filter(d => d.targetDate === selectedDateStr && (d.type === "遅刻" || d.type === "早退"));
        listTitle.innerHTML = `<i class="fa-solid fa-list mr-2 text-indigo-600"></i> 選択日の遅刻/早退一覧（${selectedDateStr}）`;
      } else if (currentFilterMode === "unread") {
        filteredData = uniqueLatestData.filter(d => d.status === "未確認");
        listTitle.innerHTML = `<i class="fa-solid fa-envelope mr-2 text-indigo-600"></i> 未確認の連絡一覧（すべて）`;
      }

      const absentCountAll = uniqueLatestData.filter(d => d.targetDate === selectedDateStr && d.type === "欠席").length;
      const lateCountAll = uniqueLatestData.filter(d => d.targetDate === selectedDateStr && (d.type === "遅刻" || d.type === "早退")).length;
      const unreadCountAll = uniqueLatestData.filter(d => d.status === "未確認").length;

      document.getElementById("statAbsent").innerText = absentCountAll;
      document.getElementById("statLate").innerText = lateCountAll;
      document.getElementById("statUnread").innerText = unreadCountAll;

      if (filteredData.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <i class="fa-solid fa-inbox text-3xl mb-2"></i>
            <p class="text-xs">該当する連絡はありません。</p>
          </div>`;
        document.getElementById("totalCount").innerText = `0件`;
        return;
      }

      let htmlBuffer = "";
      filteredData.forEach((data) => {
        const isChecked = data.status === "確認済み";
        const typeBadge = data.type === "欠席" 
          ? `<span class="bg-rose-100 text-rose-700 font-bold text-xs px-2 py-0.5 rounded">欠席</span>`
          : `<span class="bg-amber-100 text-amber-800 font-bold text-xs px-2 py-0.5 rounded">${data.type}</span>`;
        
        const statusBadge = isChecked
          ? `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded font-bold">確認済み</span>`
          : `<span class="bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded font-bold">未確認</span>`;

        const cardStyle = isChecked 
          ? "p-4 rounded-xl border border-slate-200 bg-slate-50/50" 
          : "p-4 rounded-xl border-2 border-indigo-200 bg-white shadow-sm";

        const toggleBtn = isChecked
          ? `<button onclick="toggleStatus('${data.id}', '未確認')" class="text-xs border border-slate-300 text-slate-600 px-2.5 py-1 rounded-lg hover:bg-slate-100 flex items-center">
               <i class="fa-solid fa-rotate-left mr-1"></i> 未確認に戻す
             </button>`
          : `<button onclick="toggleStatus('${data.id}', '確認済み')" class="text-xs bg-indigo-600 text-white font-bold px-3 py-1 rounded-lg hover:bg-indigo-700 flex items-center shadow-sm">
               <i class="fa-solid fa-check mr-1"></i> 確認済みにする
             </button>`;

        htmlBuffer += `
          <div class="${cardStyle}">
            <div class="flex flex-wrap justify-between items-start gap-2 mb-2">
              <div class="flex items-center gap-2">
                ${typeBadge}
                <span class="font-bold text-slate-800 text-sm">${data.name} <span class="text-xs text-slate-500 font-normal">(${data.grade})</span></span>
                ${statusBadge}
              </div>
              <div class="flex items-center gap-2">
                ${toggleBtn}
                <button onclick="deleteItem('${data.id}')" class="text-slate-400 hover:text-rose-600 text-xs p-1">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
            <p class="text-xs text-slate-500 mb-1">
              <i class="fa-regular fa-calendar mr-1"></i>対象日: ${data.targetDate} &nbsp; 
              <i class="fa-solid fa-circle-info mr-1"></i>${data.category}
            </p>
            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs text-slate-600">
              ${data.detail || '（詳細理由の記入なし）'}
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = htmlBuffer;
      document.getElementById("totalCount").innerText = `${filteredData.length}件`;
    };

    window.toggleStatus = async function(id, newStatus) {
      await updateDoc(doc(db, "absences", id), { status: newStatus });
    };

    window.deleteItem = async function(id) {
      if (confirm("この連絡を削除してもよろしいですか？")) {
        await deleteDoc(doc(db, "absences", id));
      }
    };
  </script>
</body>
</html>
