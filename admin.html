<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欠席連絡管理画面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <!-- ログイン画面 -->
  <div id="loginScreen" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
    <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
      <i class="fa-solid fa-lock mr-2 text-amber-500"></i> 管理者ログイン
    </h2>
    <input type="password" id="passInput" placeholder="パスワードを入力"
      class="w-full px-3 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button id="loginBtn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg">
      ログイン
    </button>
  </div>

  <!-- 管理画面コンテンツ -->
  <div id="adminContent" class="max-w-5xl mx-auto hidden space-y-6">
    
    <!-- ヘッダー＆フィルター -->
    <div class="bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
      <h1 class="text-xl font-bold text-slate-800 flex items-center">
        <i class="fa-solid fa-list-check mr-2 text-blue-600"></i> 欠席・遅刻連絡 一覧
      </h1>

      <!-- 日付絞り込み機能 -->
      <div class="flex items-center space-x-2">
        <label for="filterDate" class="text-sm font-bold text-slate-600 whitespace-nowrap">日付選択:</label>
        <input type="date" id="filterDate"
          class="px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="showAllBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-2 rounded-lg font-bold transition">
          すべて表示
        </button>
      </div>
    </div>

    <!-- テーブル -->
    <div class="bg-white rounded-xl shadow-md overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-800 text-white text-sm">
            <th class="p-3">対象日付</th>
            <th class="p-3">名前</th>
            <th class="p-3">区分</th>
            <th class="p-3">理由</th>
            <th class="p-3">ステータス</th>
            <th class="p-3 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="listTable" class="divide-y divide-slate-200 text-sm">
          <!-- JSで自動挿入 -->
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "club-app-f9a2f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "1234"; // ★必要に応じて新しいパスワードに変更してください

    const loginScreen = document.getElementById("loginScreen");
    const adminContent = document.getElementById("adminContent");
    const passInput = document.getElementById("passInput");
    const loginBtn = document.getElementById("loginBtn");
    const listTable = document.getElementById("listTable");
    const filterDate = document.getElementById("filterDate");
    const showAllBtn = document.getElementById("showAllBtn");

    let allAbsences = []; // 全データを保持する配列

    // ログイン機能
    loginBtn.addEventListener("click", () => {
      if (passInput.value === ADMIN_PASSWORD) {
        loginScreen.classList.add("hidden");
        adminContent.classList.remove("hidden");
        initDataSync();
      } else {
        alert("パスワードが違います");
      }
    });

    // 初期化＆リアルタイム同期設定
    function initDataSync() {
      const q = query(collection(db, "absences"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        allAbsences = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderTable();
      });
    }

    // テーブル表示処理（フィルター連動）
    function renderTable() {
      listTable.innerHTML = "";
      const selectedDate = filterDate.value;

      // 日付が指定されている場合は絞り込み、指定がなければ全表示
      const filtered = selectedDate
        ? allAbsences.filter(item => item.targetDate === selectedDate)
        : allAbsences;

      if (filtered.length === 0) {
        listTable.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">該当するデータがありません</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";

        const isChecked = item.status === "確認済み";
        const badgeColor = isChecked ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700";

        tr.innerHTML = `
          <td class="p-3 font-semibold text-blue-600">${item.targetDate || '未指定'}</td>
          <td class="p-3 font-bold text-slate-800">${item.name}</td>
          <td class="p-3"><span class="px-2 py-1 rounded bg-slate-100 font-bold">${item.type}</span></td>
          <td class="p-3 text-slate-600 max-w-xs truncate">${item.reason}</td>
          <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${badgeColor}">${item.status}</span></td>
          <td class="p-3 text-center space-x-2">
            <button onclick="toggleStatus('${item.id}', '${item.status}')"
              class="px-3 py-1 rounded text-xs font-bold text-white ${isChecked ? 'bg-slate-500 hover:bg-slate-600' : 'bg-green-600 hover:bg-green-700'}">
              ${isChecked ? '未確認に戻す' : '確認完了'}
            </button>
            <button onclick="deleteItem('${item.id}')"
              class="px-2 py-1 rounded text-xs font-bold text-red-600 hover:bg-red-50">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        listTable.appendChild(tr);
      });
    }

    // 日付フィルターイベント
    filterDate.addEventListener("change", renderTable);
    showAllBtn.addEventListener("click", () => {
      filterDate.value = "";
      renderTable();
    });

    // グローバル関数として公開（HTMLボタンのonclick用）
    window.toggleStatus = async (id, currentStatus) => {
      const newStatus = currentStatus === "確認済み" ? "未確認" : "確認済み";
      await updateDoc(doc(db, "absences", id), { status: newStatus });
    };

    window.deleteItem = async (id) => {
      if (confirm("この記録を削除しますか？")) {
        await deleteDoc(doc(db, "absences", id));
      }
    };
  </script>
</body>
</html>
