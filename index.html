<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部活動 欠席・遅刻連絡ポータル</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center">
          <i class="fa-solid fa-volleyball mr-2 text-amber-300"></i> 部活動 欠席連絡システム
        </h1>
        <p class="text-xs text-indigo-200 mt-0.5">欠席・遅刻申請フォーム（部員用）</p>
      </div>
    </div>
  </header>

  <!-- 申請フォーム -->
  <main class="max-w-xl mx-auto mt-6 px-4">
    <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
      <h2 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b flex items-center">
        <i class="fa-solid fa-paper-plane text-indigo-600 mr-2"></i> 欠席・遅刻の連絡を送信
      </h2>

      <form id="absenceForm" class="space-y-4">
        <!-- 氏名・学年 -->
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1">氏名 <span class="text-rose-500">*</span></label>
            <input type="text" id="studentName" required placeholder="山田 太郎"
              class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">学年 <span class="text-rose-500">*</span></label>
            <select id="grade" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="1年">1年</option>
              <option value="2年">2年</option>
              <option value="3年">3年</option>
            </select>
          </div>
        </div>

        <!-- 区分（欠席 / 遅刻 / 早退） -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">区分 <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-3 gap-2">
            <label class="border border-slate-200 rounded-xl p-2.5 text-center cursor-pointer hover:bg-slate-50 flex items-center justify-center text-xs font-bold text-slate-700">
              <input type="radio" name="type" value="欠席" checked class="mr-1.5 text-indigo-600 focus:ring-indigo-500"> 欠席
            </label>
            <label class="border border-slate-200 rounded-xl p-2.5 text-center cursor-pointer hover:bg-slate-50 flex items-center justify-center text-xs font-bold text-slate-700">
              <input type="radio" name="type" value="遅刻" class="mr-1.5 text-indigo-600 focus:ring-indigo-500"> 遅刻
            </label>
            <label class="border border-slate-200 rounded-xl p-2.5 text-center cursor-pointer hover:bg-slate-50 flex items-center justify-center text-xs font-bold text-slate-700">
              <input type="radio" name="type" value="早退" class="mr-1.5 text-indigo-600 focus:ring-indigo-500"> 早退
            </label>
          </div>
        </div>

        <!-- 対象日 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">対象日 <span class="text-rose-500">*</span></label>
          <input type="date" id="targetDate" required
            class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- 理由分類 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">理由分類 <span class="text-rose-500">*</span></label>
          <select id="reasonCategory" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="体調不良（発熱・風邪等）">体調不良（発熱・風邪等）</option>
            <option value="怪我・通院">怪我・通院</option>
            <option value="家庭都合・行事">家庭都合・行事</option>
            <option value="学業・補習・テスト">学業・補習・テスト</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <!-- 詳細理由 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">詳細理由・メモ</label>
          <textarea id="reasonDetail" rows="3" placeholder="今朝から38度の熱があるため欠席します。"
            class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <!-- 送信ボタン -->
        <button type="submit" id="submitBtn"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition shadow-md flex items-center justify-center">
          <i class="fa-solid fa-paper-plane mr-2"></i> 連絡を送信する
        </button>
      </form>
    </div>
  </main>

  <!-- Firebase SDK (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAar1cL7AwErIJCBalCTIxndvYu7IW3VVc",
      authDomain: "club-app-6b501.firebaseapp.com",
      projectId: "club-app-6b501",
      storageBucket: "club-app-6b501.firebasestorage.app",
      messagingSenderId: "575608909702",
      appId: "1:575608909702:web:57394e365b76ba27970607",
      measurementId: "G-9MWZKWSQTX"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 本日の日付を初期設定
    document.getElementById('targetDate').valueAsDate = new Date();

    // フォーム送信処理
    document.getElementById('absenceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 送信中...`;

      try {
        const name = document.getElementById('studentName').value;
        const grade = document.getElementById('grade').value;
        const type = document.querySelector('input[name="type"]:checked').value;
        const date = document.getElementById('targetDate').value;
        const category = document.getElementById('reasonCategory').value;
        const detail = document.getElementById('reasonDetail').value;

        // Firestoreの "absences" コレクションにデータを保存
        await addDoc(collection(db, "absences"), {
          name: name,
          grade: grade,
          type: type,
          targetDate: date,
          category: category,
          detail: detail,
          status: "未確認",
          createdAt: serverTimestamp()
        });

        alert("送信が完了しました！");
        document.getElementById('absenceForm').reset();
        document.getElementById('targetDate').valueAsDate = new Date();
      } catch (error) {
        console.error("送信エラー: ", error);
        alert("送信に失敗しました。時間をおいて再度お試しください。");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> 連絡を送信する`;
      }
    });
  </script>
</body>
</html>
