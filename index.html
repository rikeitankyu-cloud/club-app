<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部活動 欠席・遅刻連絡ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg w-full max-w-md">
    <h1 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
      <i class="fa-solid fa-paper-plane mr-2 text-blue-600"></i> 部活動 欠席・遅刻連絡フォーム
    </h1>

    <form id="absenceForm" class="space-y-4">
      <div>
        <label class="block text-slate-700 text-sm font-bold mb-1" for="name">
          お名前 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="name" required placeholder="山田 太郎"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- 対象日付を追加 -->
      <div>
        <label class="block text-slate-700 text-sm font-bold mb-1" for="targetDate">
          対象日付 <span class="text-red-500">*</span>
        </label>
        <input type="date" id="targetDate" required
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-slate-700 text-sm font-bold mb-1" for="type">
          区分 <span class="text-red-500">*</span>
        </label>
        <select id="type" required
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="欠席">欠席</option>
          <option value="遅刻">遅刻</option>
          <option value="早退">早退</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-700 text-sm font-bold mb-1" for="reason">
          理由 <span class="text-red-500">*</span>
        </label>
        <textarea id="reason" rows="3" required placeholder="体調不良のため（熱37.5度）"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200">
        送信する
      </button>
    </form>

    <div id="statusMsg" class="mt-4 text-center font-bold hidden"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "club-app-f9a2f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // デフォルトで今日の日付をセット
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("targetDate").value = today;

    const form = document.getElementById("absenceForm");
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      try {
        await addDoc(collection(db, "absences"), {
          name: document.getElementById("name").value,
          targetDate: document.getElementById("targetDate").value,
          type: document.getElementById("type").value,
          reason: document.getElementById("reason").value,
          status: "未確認",
          createdAt: serverTimestamp()
        });

        statusMsg.textContent = "送信が完了しました！";
        statusMsg.className = "mt-4 text-center font-bold text-green-600";
        statusMsg.classList.remove("hidden");
        form.reset();
        document.getElementById("targetDate").value = today;

      } catch (error) {
        console.error("Error adding document: ", error);
        statusMsg.textContent = "送信に失敗しました。";
        statusMsg.className = "mt-4 text-center font-bold text-red-600";
        statusMsg.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "送信する";
      }
    });
  </script>
</body>
</html>
